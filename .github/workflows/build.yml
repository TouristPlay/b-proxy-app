name: Сборка B-Proxy

# Приложение на Tauri 2: интерфейс из ui/, ядро libXray из scripts/build_core.sh.
# Flutter-версия (app/) больше не собирается.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Собрать и macOS (машины Apple у GitHub в очереди — долго)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  # Новый пуш отменяет старую сборку, но не релиз.
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, 'Релиз v') }}

env:
  # Релиз: тег vX.Y.Z или коммит в main с сообщением «Релиз vX.Y.Z» (тег создаст job «Релиз»).
  HEAD_MESSAGE: ${{ github.event.head_commit.message }}
  LIBXRAY_VERSION: v26.11.9
  NDK_VERSION: r28c
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: Интерфейс (React)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Установить зависимости
        working-directory: ui
        run: npm ci --no-audit --no-fund
      - name: Проверить типы и собрать демо
        working-directory: ui
        run: npm run build:preview
      - uses: actions/upload-artifact@v7
        with:
          name: b-proxy-ui-preview
          path: ui/dist-preview/index.html
          if-no-files-found: error

      - name: Выложить демо в ветку ui-preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/preview && cp ui/dist-preview/index.html /tmp/preview/
          cd /tmp/preview
          git init -q -b ui-preview
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html
          git commit -qm "Демо интерфейса ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ui-preview

  linux:
    name: Linux (deb, rpm, AppImage)
    needs: ui
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - name: Ядро из кэша
        id: core-cache
        uses: actions/cache@v4
        with:
          path: ui/src-tauri/resources/linux
          key: core-linux-${{ env.LIBXRAY_VERSION }}-${{ hashFiles('core/**', 'scripts/build_core.sh') }}
      - name: Собрать ядро
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: ./scripts/build_core.sh linux
      - name: Собрать приложение
        working-directory: ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          npx tauri icon src-tauri/app-icon.png
          npx tauri build --config "$(../scripts/tauri_build_conf.sh)"
      - uses: actions/upload-artifact@v7
        with:
          name: b-proxy-linux
          path: |
            ui/src-tauri/target/release/bundle/deb/*.deb*
            ui/src-tauri/target/release/bundle/rpm/*.rpm*
            ui/src-tauri/target/release/bundle/appimage/*.AppImage*
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: ui
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - name: Ядро из кэша
        id: core-cache
        uses: actions/cache@v4
        with:
          path: ui/src-tauri/resources/windows
          key: core-windows-${{ env.LIBXRAY_VERSION }}-${{ hashFiles('core/**', 'scripts/build_core.sh') }}
      - name: Собрать ядро и скачать Wintun
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: ./scripts/build_core.sh windows
      - name: Собрать приложение
        working-directory: ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          npx tauri icon src-tauri/app-icon.png
          npx tauri build --config "$(../scripts/tauri_build_conf.sh)"
      - uses: actions/upload-artifact@v7
        with:
          name: b-proxy-windows
          path: |
            ui/src-tauri/target/release/bundle/nsis/*.exe*
            ui/src-tauri/target/release/bundle/msi/*.msi*
          if-no-files-found: error

  # macOS пока не нужен: только вручную (Actions → Run workflow → «Собрать и macOS»).
  macos:
    name: macOS (Apple Silicon и Intel)
    needs: ui
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - name: Ядро из кэша
        id: core-cache
        uses: actions/cache@v4
        with:
          path: ui/src-tauri/resources/macos
          key: core-macos-${{ env.LIBXRAY_VERSION }}-${{ hashFiles('core/**', 'scripts/build_core.sh') }}
      - name: Собрать ядро
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: ./scripts/build_core.sh macos
      - name: Собрать приложение (без подписи)
        working-directory: ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          npx tauri icon src-tauri/app-icon.png
          # hdiutil на раннерах GitHub иногда отвечает «Resource busy» — повторяем.
          for attempt in 1 2 3; do
            npx tauri build --target universal-apple-darwin --bundles app,dmg --config "$(../scripts/tauri_build_conf.sh)" && break
            [ "$attempt" = 3 ] && exit 1
            echo "Повтор сборки образа ($attempt)"; sleep 15
          done
      - uses: actions/upload-artifact@v7
        with:
          name: b-proxy-macos
          path: |
            ui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            ui/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  android:
    name: Android (APK)
    needs: ui
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /opt/microsoft /opt/google/chrome
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - name: Ядро из кэша
        id: core-cache
        uses: actions/cache@v4
        with:
          path: ui/src-tauri/resources/android
          key: core-android-${{ env.LIBXRAY_VERSION }}-${{ env.NDK_VERSION }}-${{ hashFiles('core/**', 'scripts/build_core.sh') }}
      - name: Собрать ядро
        if: steps.core-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          ./scripts/build_core.sh android
          go clean -cache
          rm -rf .build
      - name: Создать проект Android
        working-directory: ui
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          npm ci --no-audit --no-fund
          npx tauri android init --ci
          npx tauri icon src-tauri/app-icon.png
          # Ядро libXray (gomobile) — в само приложение; плагин видит только его классы.
          cat >> src-tauri/gen/android/app/build.gradle.kts <<'EOF'

          // B-Proxy: ядро Xray, собирает scripts/build_core.sh android
          dependencies {
              implementation(files("../../../resources/android/libXray.aar"))
          }
          EOF
      - name: Собрать APK
        working-directory: ui
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: npx tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64
      - name: Подписать тестовым ключом
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          for apk in $(find ui/src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk'); do
            abi=$(basename "$(dirname "$(dirname "$apk")")")
            "$BT/zipalign" -f 4 "$apk" /tmp/aligned.apk
            "$BT/apksigner" sign --ks ui/src-tauri/signing/test-release.jks \
              --ks-pass pass:bproxy-test --ks-key-alias bproxy-test \
              --out "dist/b-proxy-$abi.apk" /tmp/aligned.apk
          done
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: b-proxy-android
          path: dist/*.apk
          if-no-files-found: error

  # iOS — только в релиз и вручную: машин Apple у GitHub мало, обычный пуш их не ждёт.
  ios:
    name: iOS (без подписи)
    needs: ui
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'Релиз v')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - name: Ядро из кэша
        id: core-cache
        uses: actions/cache@v4
        with:
          path: ui/src-tauri/resources/ios
          key: core-ios-${{ env.LIBXRAY_VERSION }}-${{ hashFiles('core/**', 'scripts/build_core.sh') }}
      - name: Собрать ядро
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: ./scripts/build_core.sh ios
      - name: Создать проект iOS и добавить PacketTunnel
        working-directory: ui
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          pip install pyyaml
          npm ci --no-audit --no-fund
          npx tauri ios init --ci
          npx tauri icon src-tauri/app-icon.png
          python ../scripts/tauri_ios_extension.py --unsigned
          (cd src-tauri/gen/apple && xcodegen generate)
      - name: Собрать приложение
        working-directory: ui
        run: |
          set -o pipefail
          # Без подписи экспорт .ipa падает, но архив с приложением уже собран.
          npx tauri ios build --ci --target aarch64 2>&1 | tee /tmp/ios-build.log || true
          APP=$(find src-tauri/gen/apple/build -name "*.app" -path "*Products/Applications*" | head -1)
          if [ -z "$APP" ]; then
            grep -nE "error:|: error|fatal|Undefined symbol|ld: " /tmp/ios-build.log | head -80
            tail -60 /tmp/ios-build.log
            exit 1
          fi
          ls "$APP" "$APP/PlugIns" || true
          mkdir -p /tmp/ipa/Payload "$GITHUB_WORKSPACE/dist"
          cp -R "$APP" /tmp/ipa/Payload/
          (cd /tmp/ipa && zip -qry "$GITHUB_WORKSPACE/dist/b-proxy-ios-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v7
        with:
          name: b-proxy-ios-unsigned
          path: dist/b-proxy-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Релиз
    # Linux, Windows и Android обязательны; macOS и iOS — если собрались (очередь Apple не держит релиз).
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Релиз v'))) &&
      needs.linux.result == 'success' && needs.windows.result == 'success' && needs.android.result == 'success' &&
      needs.macos.result != 'failure' && needs.ios.result != 'failure'
    needs: [linux, windows, macos, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Тег релиза
        id: tag
        run: echo "tag=v$(scripts/tauri_build_conf.sh --version)" >> "$GITHUB_OUTPUT"
      - name: Файл обновления latest.json
        run: |
          mkdir -p artifacts/updater
          if find artifacts -name "*.sig" | grep -q .; then
            python3 scripts/updater_manifest.py artifacts "${{ steps.tag.outputs.tag }}" "$GITHUB_REPOSITORY" > artifacts/updater/latest.json
          else
            echo "::warning::Нет ключа подписи TAURI_SIGNING_PRIVATE_KEY — релиз без автообновления"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: B-Proxy ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/b-proxy-linux/**/*
            artifacts/b-proxy-windows/**/*
            artifacts/b-proxy-macos/**/*
            artifacts/b-proxy-android/*
            artifacts/b-proxy-ios-unsigned/*
            artifacts/updater/*
