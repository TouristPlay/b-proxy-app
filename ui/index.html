<!doctype html>
<html lang="ru" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>B-Proxy</title>
    <!--
      Заставка при запуске: над горизонтом встаёт солнце цвета темы, на нём проступает
      баобаб со щитом (знак B-Proxy вырезан из солнца), от него расходятся кольца, как у
      главной кнопки. Показывается сразу, до загрузки интерфейса, и растворяется, когда
      приложение готово (src/lib/splash.ts). Без анимаций — если они выключены в настройках
      или в системе.
    -->
    <style>
      #splash {
        --sp-accent: #f2b04b;
        --sp-base: #0a0e13;
        --sp-size: min(38vw, 168px);
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: calc(var(--sp-size) * 0.32);
        background: var(--sp-base);
        overflow: hidden;
        pointer-events: none;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #splash .sp-glow {
        position: absolute;
        width: calc(var(--sp-size) * 4.2);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, color-mix(in oklab, var(--sp-accent) 34%, transparent) 0%, transparent 62%);
        opacity: 0;
        transform: translateY(-14%);
        animation: sp-fade 1.4s 0.35s ease-out forwards;
      }
      #splash .sp-stage {
        position: relative;
        width: var(--sp-size);
        aspect-ratio: 1;
        transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1), filter 0.55s;
      }
      /* Окно с нижним краем по горизонту: солнце поднимается из-за него. */
      #splash .sp-rise {
        position: absolute;
        inset: -40% -40% 0;
        overflow: hidden;
      }
      #splash .sp-sun {
        position: absolute;
        left: 22.22%;
        right: 22.22%;
        bottom: 0;
        aspect-ratio: 1;
        transform: translateY(102%);
        animation: sp-rise 1s 0.15s cubic-bezier(0.16, 0.84, 0.24, 1) forwards;
      }
      #splash .sp-disc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 28%, color-mix(in oklab, var(--sp-accent) 78%, white) 0%, var(--sp-accent) 46%, color-mix(in oklab, var(--sp-accent) 84%, black) 100%);
        box-shadow: 0 0 calc(var(--sp-size) * 0.5) color-mix(in oklab, var(--sp-accent) 45%, transparent);
      }
      #splash svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        fill: var(--sp-base);
        overflow: visible;
      }
      /* Крона чуть «распускается» снизу вверх, когда солнце почти встало. */
      #splash .sp-tree {
        transform-origin: 50% 92%;
        transform: scale(0.94);
        animation: sp-grow 0.9s 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      #splash .sp-horizon {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: calc(var(--sp-size) * 2.6);
        height: 1px;
        translate: -50% 0;
        background: linear-gradient(90deg, transparent, var(--sp-accent), transparent);
        transform: scaleX(0);
        opacity: 0.9;
        animation: sp-line 0.7s ease-out forwards, sp-dim 0.6s 1.1s ease-out forwards;
      }
      #splash .sp-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid var(--sp-accent);
        opacity: 0;
        animation: sp-ring 1.3s 1.05s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }
      #splash .sp-ring + .sp-ring {
        animation-delay: 1.3s;
      }
      #splash .sp-word {
        position: relative;
        font-family: "Unbounded Variable", "Unbounded", system-ui, sans-serif;
        font-weight: 600;
        font-size: calc(var(--sp-size) * 0.2);
        color: var(--sp-ink, #f4f1ea);
        letter-spacing: 0.32em;
        margin-right: -0.32em;
        opacity: 0;
        animation: sp-word 0.8s 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      /* Уход: заставка растворяется, знак чуть приближается — за ним уже интерфейс. */
      #splash.sp-out {
        opacity: 0;
      }
      #splash.sp-out .sp-stage {
        transform: scale(1.12);
        filter: blur(6px);
      }
      /* Без движения: сразу итоговый кадр и короткое растворение. */
      #splash.sp-still *,
      #splash.sp-still {
        animation: none !important;
        transition-duration: 0.2s !important;
      }
      #splash.sp-still .sp-sun,
      #splash.sp-still .sp-tree,
      #splash.sp-still .sp-horizon {
        transform: none;
      }
      #splash.sp-still .sp-glow,
      #splash.sp-still .sp-word {
        opacity: 1;
        letter-spacing: 0.04em;
        margin-right: -0.04em;
      }
      #splash.sp-still .sp-horizon {
        opacity: 0.35;
      }
      #splash.sp-still .sp-stage {
        transform: none !important;
        filter: none !important;
      }
      @keyframes sp-rise {
        to { transform: translateY(0); }
      }
      @keyframes sp-grow {
        to { transform: scale(1); }
      }
      @keyframes sp-line {
        to { transform: scaleX(1); }
      }
      @keyframes sp-dim {
        to { opacity: 0.35; }
      }
      @keyframes sp-fade {
        to { opacity: 1; }
      }
      @keyframes sp-ring {
        0% { opacity: 0.55; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.75); }
      }
      @keyframes sp-word {
        to { opacity: 1; letter-spacing: 0.04em; margin-right: -0.04em; }
      }
    </style>
  </head>
