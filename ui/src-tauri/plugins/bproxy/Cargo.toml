[package]
name = "tauri-plugin-bproxy"
version = "0.1.0"
description = "B-Proxy: ядро Xray и VPN-туннель на всех платформах"
edition = "2021"
rust-version = "1.80"
links = "tauri-plugin-bproxy"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
sha2 = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
libloading = "0.8"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
