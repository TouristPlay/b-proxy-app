[package]
name = "b-proxy"
version = "0.2.3"
authors = ["B-Proxy"]
description = "B-Proxy — VPN-клиент на ядре Xray"
edition = "2021"
rust-version = "1.80"

[lib]
name = "b_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-bproxy = { path = "plugins/bproxy" }
serde = { version = "1", features = ["derive"] }
# Нужен generate_context и на телефонах: конфиг ссылок bproxy:// разбирается при сборке.
serde_json = "1"
# Отчёты о сбоях (паники Rust) — в Sentry-совместимый сервер, если DSN задан при сборке.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
