[package]
name = "b-proxy"
version = "0.1.0"
description = "B-Proxy — VPN-клиент BaobabVPN на ядре Xray"
edition = "2021"
rust-version = "1.80"

[lib]
name = "b_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-bproxy = { path = "plugins/bproxy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
