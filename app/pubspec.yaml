name: b_proxy
description: "B-Proxy — VPN-клиент BaobabVPN на ядре Xray."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  ffi: ^2.1.3
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  b_proxy_apple:
    path: packages/b_proxy_apple

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_disc.png
